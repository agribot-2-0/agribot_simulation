image: docker:git

pipelines:
  default:
     - step:
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci
           - .industrial_ci/bitbucket.sh ROS_DISTRO=melodic UPSTREAM_WORKSPACE='bitbucket:agribotteam/agribot_msgs#master'

definitions:
  services:
    docker:
      memory: 2048