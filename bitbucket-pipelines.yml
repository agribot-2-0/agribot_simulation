image: docker:18-git

pipelines:
  default:
     - step:
         name: "Check pylint"
         script:
           - apk add --update bash coreutils tar python py-pip
           - pip install pylint
           - git clone https://github.com/panpawelchmiel/agribot_common.git
           - pylint --rcfile=agribot_common/pylint_conf/.pylintrc scripts/*.py
     - step:
         size: 2x
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci -b master
           - git clone https://github.com/panpawelchmiel/agribot_msgs.git
           - .industrial_ci/bitbucket.sh  ROS_DISTRO="melodic" UPSTREAM_WORKSPACE="agribot_msgs"

definitions:
  services:
    docker:
      memory: 7128
