image: docker:git

pipelines:
  default:
     - step:
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci
           - .industrial_ci/bitbucket.sh UPSTREAM_WORKSPACE="bitbucket:agribotteam/agribot_msgs#master" ROS_DISTRO="melodic"

definitions:
  services:
    docker:
      memory: 2048